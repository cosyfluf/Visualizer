<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Pro Editor</title>
    
    <!-- Styles & Fonts -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <!-- TOP TOOLBAR -->
    <header class="main-header">
        <div class="header-section left">
            <button class="icon-btn" title="Back"><i class="fas fa-chevron-left"></i></button>
            <div class="divider"></div>
            <div class="tool-group">
                <button class="tool-btn active" id="tool-select" title="Select (V)"><i class="fas fa-mouse-pointer"></i></button>
                <button class="tool-btn" id="tool-move" title="Move (M)"><i class="fas fa-arrows-alt"></i></button>
                <button class="tool-btn" id="tool-scale" title="Scale (S)"><i class="fas fa-expand-alt"></i></button>
                <button class="tool-btn" id="tool-rotate" title="Rotate (R)"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>

        <div class="header-section center">
            <div class="status-badge" id="hz-display">Engine: Ready</div>
            <button class="audio-toggle" onclick="initAudio()"><i class="fas fa-microphone"></i> Enable Audio</button>
        </div>

        <div class="header-section right">
            <input type="text" id="project-name" class="project-input" value="My_Wallpaper_Project">
            <button class="save-btn" onclick="saveProject()">Save Project</button>
        </div>
    </header>

    <main class="editor-layout">
        <!-- LEFT SIDEBAR: HIERARCHY -->
        <aside class="sidebar left-bar">
            <div class="panel-header">
                <span>Hierarchy</span>
                <div class="dropdown">
                    <button class="add-obj-btn">+</button>
                    <div class="dropdown-content">
                        <a href="#" onclick="addObj('rect')"><i class="fas fa-square"></i> Rectangle</a>
                        <a href="#" onclick="addObj('circle')"><i class="fas fa-circle"></i> Circle</a>
                        <a href="#" onclick="addObj('visualizer')"><i class="fas fa-chart-bar"></i> Visualizer</a>
                    </div>
                </div>
            </div>
            <div id="layer-list" class="layer-container">
                <!-- Layers will be injected here -->
            </div>
            <div class="sidebar-footer">Drag images to canvas</div>
        </aside>

        <!-- CENTER: VIEWPORT -->
        <section class="viewport-area" id="drop-zone">
            <div class="canvas-wrapper">
                <div class="ruler-top"></div>
                <div class="ruler-left"></div>
                <!-- Deine viz-ID für core.js -->
                <canvas id="viz"></canvas> 
            </div>
        </section>

        <!-- RIGHT SIDEBAR: PROPERTIES -->
        <aside class="sidebar right-bar">
            <div class="panel-header">Properties</div>
            <div id="properties-panel" class="props-container">
                <div class="empty-state">Select an object to edit properties</div>
            </div>
        </aside>
    </main>
</div>

<!-- SCRIPT EDITOR MODAL -->
<div id="script-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="script-title">Logic Canvas</span>
            <button class="close-modal" onclick="closeScripts()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="logic-palette">
                <div class="cat-label">Events</div>
                <div class="block b-event" draggable="true">On Bass Hit</div>
                <div class="block b-event" draggable="true">Every Beat</div>
                <div class="cat-label">Actions</div>
                <div class="block b-action" draggable="true">Animate Position</div>
                <div class="block b-action" draggable="true">Shake Screen</div>
            </div>
            <div class="logic-canvas">
                <p>Logic block editor workspace...</p>
            </div>
        </div>
    </div>
</div>

<!-- JS Dateien nacheinander laden -->
<script src="audio-engine.js"></script>
<script src="custom-engine.js"></script>
<script src="core.js"></script>
<script src="editor-logic.js"></script>

</body>
</html>
